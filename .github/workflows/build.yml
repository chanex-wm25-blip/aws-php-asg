name: CI - Build Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
  workflow_call:
    inputs:
      action:
        description: "Terraform action to run (plan / apply / destroy)"
        required: false
        type: string
        default: plan
    outputs:
      s3_bucket:
        description: "Resolved uploads/artifacts S3 bucket name (from terraform output). Only populated on apply."
        value: ${{ jobs.terraform.outputs.s3_bucket }}
      asg_name:
        description: "Resolved ASG name (from terraform output). Only populated on apply."
        value: ${{ jobs.terraform.outputs.asg_name }}

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/envs/sandbox

# Prevent concurrent state lock conflicts in S3/DynamoDB
concurrency:
  group: terraform-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      s3_bucket: ${{ steps.tf_output.outputs.s3_bucket }}
      asg_name: ${{ steps.tf_output.outputs.asg_name }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf_output
        if: ${{ inputs.action == 'apply' && success() }}
        run: |
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "asg_name=$(terraform output -raw asg_name)" >> "$GITHUB_OUTPUT"

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve