name: CI - Full Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan/destroy = infra only. deploy = apply infra, then deploy app code."
        required: true
        type: choice
        options:
          - plan
          - deploy
          - destroy
        default: deploy
      ref:
        description: "Git ref to deploy (only used when mode=deploy)"
        required: false
        default: main

permissions:
  contents: read

jobs:
  infra-only:
    name: Infra ${{ inputs.mode }}
    if: inputs.mode == 'plan' || inputs.mode == 'destroy'
    uses: ./.github/workflows/build.yml
    with:
      action: ${{ inputs.mode }}
    secrets: inherit

  full-deploy:
    name: Apply infra + deploy app
    if: inputs.mode == 'deploy'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit