name: CD - Deploy Application

# Reusable workflow (workflow_call) - invoked by ci.yml, but also kept
# independently manually runnable (workflow_dispatch). Never auto-triggered on
# push. Deploying always applies infra first (job `infra` below, which calls
# build.yml) so the `app` job never targets instances/an ASG that don't exist
# yet or are out of date - that's the sequencing this workflow guarantees.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: shuttle-bus-ticketing
  ARTIFACT_PREFIX: artifacts
  APP_TAG: assignment-shuttle-bus-ticketing
  ASG_NAME: assignment-asg
  EC2_NAME_TAG: assignment-ec2

jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    runs-on: ubuntu-latest
    # Bucket name comes from the infra job's terraform output, not a hardcoded
    # value - keeps this in lockstep with the account-ID-suffixed bucket name.
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install app dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --optimize-autoloader
          else
            echo "No composer.json found, skipping composer install."
          fi

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip . -x "uploads/*"

      - name: Upload artifact to S3
        run: |
          aws s3 cp assignment-app.zip \
            "s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip"

      # The other half of the sequencing fix: `terraform apply` in the `infra`
      # job returns as soon as the AWS API calls succeed, not once instances
      # have finished booting and registered with SSM. Poll until at least one
      # is actually reachable before sending the deploy command to it.
      - name: Wait for an SSM-managed running instance
        run: |
          set -euo pipefail

          echo "Polling for running ASG instances and SSM registration..."
          echo "Looking for ASG: ${{ env.ASG_NAME }}"
          for i in $(seq 1 45); do
            # 1. Search by Auto Scaling Group name
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --filters "Name=instance-state-name,Values=running" "Name=tag:aws:autoscaling:groupName,Values=${{ env.ASG_NAME }}" \
              --query "Reservations[].Instances[].InstanceId" --output text)

            # 2. Fallback search by Name tag
            if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
              INSTANCE_IDS=$(aws ec2 describe-instances \
                --filters "Name=instance-state-name,Values=running" "Name=tag:Name,Values=${{ env.ASG_NAME }}-instance,${{ env.EC2_NAME_TAG }}" \
                --query "Reservations[].Instances[].InstanceId" --output text)
            fi

            # 3. Fallback search by App tag
            if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
              INSTANCE_IDS=$(aws ec2 describe-instances \
                --filters "Name=instance-state-name,Values=running" "Name=tag:App,Values=${{ env.APP_TAG }}" \
                --query "Reservations[].Instances[].InstanceId" --output text)
            fi

            if [ -n "$INSTANCE_IDS" ] && [ "$INSTANCE_IDS" != "None" ]; then
              IDS_CSV=$(echo "$INSTANCE_IDS" | tr '\t ' ',' | sed 's/,,*/,/g; s/^,//; s/,$//')
              ONLINE_COUNT=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$IDS_CSV" \
                --query "length(InstanceInformationList[?PingStatus=='Online'])" --output text 2>/dev/null || echo "0")

              if [ "$ONLINE_COUNT" != "0" ] && [ "$ONLINE_COUNT" != "None" ]; then
                echo "SUCCESS: Found $ONLINE_COUNT SSM-managed instance(s) online: $INSTANCE_IDS"
                exit 0
              else
                echo "Found running instance(s) ($INSTANCE_IDS), waiting for SSM agent to report Online (attempt $i/45)..."
              fi
            else
              echo "Waiting for EC2 instances to reach 'running' state (attempt $i/45)..."
              if [ $((i % 5)) -eq 0 ]; then
                echo "--- ASG Scaling Activities ---"
                aws autoscaling describe-scaling-activities --auto-scaling-group-name "${{ env.ASG_NAME }}" --max-items 3 --query "Activities[].[StatusCode,Description,Cause]" --output text 2>&1 || true
              fi
            fi

            sleep 10
          done

          echo "Timed out waiting for a running, SSM-managed instance."
          echo "--- Recent ASG Scaling Activities ---"
          aws autoscaling describe-scaling-activities --auto-scaling-group-name "${{ env.ASG_NAME }}" --max-items 5 --output table 2>&1 || true
          exit 1

      - name: Deploy to ASG instances via SSM
        run: |
          set -euo pipefail

          # Resolve all running instances in the ASG
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running" "Name=tag:aws:autoscaling:groupName,Values=${{ env.ASG_NAME }}" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --filters "Name=instance-state-name,Values=running" "Name=tag:Name,Values=${{ env.ASG_NAME }}-instance,${{ env.EC2_NAME_TAG }}" \
              --query "Reservations[].Instances[].InstanceId" --output text)
          fi

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --filters "Name=instance-state-name,Values=running" "Name=tag:App,Values=${{ env.APP_TAG }}" \
              --query "Reservations[].Instances[].InstanceId" --output text)
          fi

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No running instances found for deployment."
            exit 1
          fi

          IDS_LIST=$(echo "$INSTANCE_IDS" | tr '\t' ' ')
          echo "Deploying application to instance(s): $IDS_LIST"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $IDS_LIST \
            --comment "shuttle-bus-ticketing deploy" \
            --parameters '{"commands":[
              "cloud-init status --wait || true",
              "aws s3 cp s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip /tmp/assignment-app.zip",
              "sudo rm -rf /var/www/html/*",
              "sudo unzip -o /tmp/assignment-app.zip -d /var/www/html",
              "sudo systemctl restart httpd"
            ]}' \
            --query "Command.CommandId" --output text)

          for id in $IDS_LIST; do
            echo "Waiting for deploy command execution on $id..."
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$id"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id"
          done
