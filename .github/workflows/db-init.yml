name: DB - Seed Database (one-time)

on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  APP_TAG: shuttle-bus-ticketing-shuttle-bus-ticketing
  SCHEMA_KEY: db-init/schema.sql
  SCRIPT_KEY: db-init/seed-db.sh
  SCHEMA_BUCKET: "" # Satisfies the VS Code static linter; populated dynamically at runtime

permissions:
  contents: read

jobs:
  seed:
    name: Seed RDS from schema.sql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Resolve S3 bucket from Terraform output
        working-directory: infra/envs/sandbox
        run: |
          terraform init -input=false
          echo "SCHEMA_BUCKET=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_ENV"

      - name: Upload schema.sql, seed script, and sample images to S3
        run: |
          aws s3 cp src/schema.sql "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCHEMA_KEY }}"
          aws s3 cp infra/script/seed-db.sh "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCRIPT_KEY }}"
          aws s3 sync src/uploads/ "s3://${{ env.SCHEMA_BUCKET }}/uploads/" \
            --exclude "index.html"

      - name: Run seed script on a running app instance via SSM
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=${{ env.APP_TAG }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "No running app instance found - apply infra and wait for at least one healthy instance first."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --comment "sport-facility-bookings db seed" \
            --parameters '{"commands":[
              "aws s3 cp s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCRIPT_KEY }} /tmp/seed-db.sh",
              "chmod +x /tmp/seed-db.sh",
              "AWS_REGION=${{ env.AWS_REGION }} /tmp/seed-db.sh s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCHEMA_KEY }} ${{ env.SCHEMA_BUCKET }}"
            ]}' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi